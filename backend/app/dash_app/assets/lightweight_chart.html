<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Symbol Chart</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fcfcfb;
    color: #0b0b0b;
    overflow: hidden;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(11, 11, 11, 0.1);
    box-sizing: border-box;
  }
  #symbol-label {
    font-weight: 700;
    font-size: 14px;
  }
  #last-price {
    font-variant-numeric: tabular-nums;
    color: #52514e;
  }
  .tf-group {
    display: inline-flex;
    border: 1px solid rgba(11, 11, 11, 0.1);
    border-radius: 6px;
    overflow: hidden;
  }
  .tf-btn {
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 4px 9px;
    border: none;
    border-right: 1px solid rgba(11, 11, 11, 0.1);
    background: transparent;
    color: #52514e;
    cursor: pointer;
  }
  .tf-btn:last-child {
    border-right: none;
  }
  .tf-btn:hover {
    background: rgba(42, 120, 214, 0.08);
  }
  .tf-btn.active {
    background: rgba(42, 120, 214, 0.14);
    color: #2a78d6;
  }
  #status {
    padding: 8px 12px;
    color: #898781;
    font-size: 13px;
  }
  #indicators-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: #52514e;
    cursor: pointer;
  }
  #chart-container {
    position: absolute;
    top: 42px;
    left: 0;
    right: 0;
    bottom: 0;
  }
</style>
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="toolbar">
    <span id="symbol-label">Select a symbol</span>
    <span id="last-price"></span>
    <div class="tf-group" id="tf-group"></div>
    <label id="indicators-toggle">
      <input type="checkbox" id="indicators-checkbox" /> Levels
    </label>
  </div>
  <div id="status"></div>
  <div id="chart-container"></div>

<script>
// Same TIMEFRAME_OPTIONS/aggregateBars logic as
// frontend/src/utils/aggregateBars.ts, ported to vanilla JS so this
// standalone page can fetch/render with real lightweight-charts smoothness
// (pan/zoom/crosshair) instead of approximating it through Plotly.
const TIMEFRAME_OPTIONS = [
  { key: "1m", label: "1m", kind: "intraday", minutes: 1 },
  { key: "5m", label: "5m", kind: "intraday", minutes: 5 },
  { key: "15m", label: "15m", kind: "intraday", minutes: 15 },
  { key: "1h", label: "1h", kind: "historical", alpacaTimeframe: "1Hour" },
  { key: "4h", label: "4h", kind: "historical", alpacaTimeframe: "4Hour" },
  { key: "1D", label: "D", kind: "historical", alpacaTimeframe: "1Day" },
  { key: "1W", label: "W", kind: "historical", alpacaTimeframe: "1Week" },
  { key: "1M", label: "M", kind: "historical", alpacaTimeframe: "1Month" },
];
const DEFAULT_KEY = "5m";

// "series"-kind indicator sub-series (e.g. an EMA) carry the same per-bar
// cardinality as `bars` -- both come from the same backend minute-bar fetch
// -- so they need bucketing the same way vwap does (last known value per
// bucket) whenever the chart is showing an aggregated timeframe. Left
// unaggregated, a 1-minute-resolution line squeezed into a view built for
// much coarser bars packs far more bars into the same visible time window
// than the candles have, which trips lightweight-charts' own minBarSpacing
// and silently narrows the visible range out from under the user the
// moment the indicator is toggled on.
function aggregateBars(bars, vwap, minutes, indicators) {
  indicators = indicators || [];
  if (minutes === 1) return { bars, vwap, indicators };
  const bucketMs = minutes * 60000;
  const outBars = [];
  const outVwap = [];

  const slots = [];
  indicators.forEach((indicator, i) => {
    if (indicator.kind !== "series") return;
    Object.entries(indicator.series).forEach(([subName, points]) => {
      if (Array.isArray(points)) slots.push({ key: i + ":" + subName, points, out: [] });
    });
  });

  for (let i = 0; i < bars.length; i++) {
    const bar = bars[i];
    const bucketStart = Math.floor(new Date(bar.t).getTime() / bucketMs) * bucketMs;
    const current = outBars[outBars.length - 1];
    if (current && new Date(current.t).getTime() === bucketStart) {
      current.h = Math.max(current.h, bar.h);
      current.l = Math.min(current.l, bar.l);
      current.c = bar.c;
      current.v += bar.v;
      outVwap[outVwap.length - 1] = vwap[i] ?? outVwap[outVwap.length - 1];
      slots.forEach((slot) => {
        const v = slot.points[i] && slot.points[i].value;
        slot.out[slot.out.length - 1] = v != null ? v : slot.out[slot.out.length - 1];
      });
    } else {
      outBars.push({ t: new Date(bucketStart).toISOString(), o: bar.o, h: bar.h, l: bar.l, c: bar.c, v: bar.v });
      outVwap.push(vwap[i] ?? null);
      slots.forEach((slot) => {
        slot.out.push(slot.points[i] ? slot.points[i].value : null);
      });
    }
  }

  const slotsByKey = {};
  slots.forEach((s) => { slotsByKey[s.key] = s; });
  const outIndicators = indicators.map((indicator, i) => {
    if (indicator.kind !== "series") return indicator;
    const newSeries = {};
    Object.keys(indicator.series).forEach((subName) => {
      const slot = slotsByKey[i + ":" + subName];
      newSeries[subName] = slot
        ? outBars.map((b, idx) => ({ t: b.t, value: slot.out[idx] }))
        : indicator.series[subName];
    });
    return Object.assign({}, indicator, { series: newSeries });
  });

  return { bars: outBars, vwap: outVwap, indicators: outIndicators };
}

function toUnixSeconds(iso) {
  return Math.floor(new Date(iso).getTime() / 1000);
}
function barToCandle(bar) {
  return { time: toUnixSeconds(bar.t), open: bar.o, high: bar.h, low: bar.l, close: bar.c };
}
function barToVolume(bar) {
  const up = bar.c >= bar.o;
  return { time: toUnixSeconds(bar.t), value: bar.v, color: up ? "rgba(12,163,12,0.5)" : "rgba(208,59,59,0.5)" };
}

const TIME_FORMAT = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });
const DAY_FORMAT = new Intl.DateTimeFormat(undefined, { day: "2-digit", month: "short" });
const MONTH_FORMAT = new Intl.DateTimeFormat(undefined, { month: "short", year: "numeric" });
const YEAR_FORMAT = new Intl.DateTimeFormat(undefined, { year: "numeric" });
const CROSSHAIR_FORMAT = new Intl.DateTimeFormat(undefined, {
  day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false,
});

function tickMarkFormatter(time, tickMarkType) {
  const date = new Date(time * 1000);
  const TT = LightweightCharts.TickMarkType;
  switch (tickMarkType) {
    case TT.Year: return YEAR_FORMAT.format(date);
    case TT.Month: return MONTH_FORMAT.format(date);
    case TT.DayOfMonth: return DAY_FORMAT.format(date);
    default: return TIME_FORMAT.format(date);
  }
}

const params = new URLSearchParams(window.location.search);
const symbol = (params.get("symbol") || "").toUpperCase();
document.getElementById("symbol-label").textContent = symbol || "Select a symbol";

const tfGroup = document.getElementById("tf-group");
let activeKey = DEFAULT_KEY;
TIMEFRAME_OPTIONS.forEach((opt) => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "tf-btn" + (opt.key === activeKey ? " active" : "");
  btn.textContent = opt.label;
  btn.onclick = () => {
    activeKey = opt.key;
    Array.from(tfGroup.children).forEach((c) => c.classList.remove("active"));
    btn.classList.add("active");
    loadChart();
  };
  tfGroup.appendChild(btn);
});

const container = document.getElementById("chart-container");
const statusEl = document.getElementById("status");

const chart = LightweightCharts.createChart(container, {
  layout: { background: { color: "transparent" }, textColor: "#52514e" },
  grid: { vertLines: { color: "#e1e0d9" }, horzLines: { color: "#e1e0d9" } },
  timeScale: { timeVisible: true, secondsVisible: false, minBarSpacing: 3, tickMarkFormatter },
  localization: { timeFormatter: (time) => CROSSHAIR_FORMAT.format(new Date(time * 1000)) },
  autoSize: true,
});

const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor: "#0ca30c",
  downColor: "#d03b3b",
  borderVisible: false,
  wickUpColor: "#0ca30c",
  wickDownColor: "#d03b3b",
});
candleSeries.priceScale().applyOptions({ scaleMargins: { top: 0.05, bottom: 0.3 } });

const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
  priceScaleId: "volume",
  priceFormat: { type: "volume" },
});
chart.priceScale("volume").applyOptions({ scaleMargins: { top: 0.75, bottom: 0 } });

// VWAP overlays the same right-hand price scale as the candles -- the
// day-trading reference line, not a secondary measure.
const vwapSeries = chart.addSeries(LightweightCharts.LineSeries, {
  color: "#eda100",
  lineWidth: 2,
  crosshairMarkerVisible: false,
  lastValueVisible: false,
});

// Toggling the checkbox redraws from the last-fetched indicators without a
// full reload -- these don't change bar to bar, only on symbol/timeframe
// switch, so there's no need to re-fetch just to flip visibility. A
// "series"-kind indicator (e.g. an EMA) is its own chart series, not just
// a value on the existing candle series, so it needs addSeries/removeSeries
// rather than createPriceLine/removePriceLine.
let lastIndicators = [];
let priceLines = [];
let indicatorLineSeries = [];
const indicatorsCheckbox = document.getElementById("indicators-checkbox");

function drawIndicatorLines(indicators) {
  // Adding/removing a "series"-kind indicator (e.g. an EMA, sourced from
  // 1-minute bars regardless of the displayed timeframe) can be a much
  // higher time-resolution than the currently-displayed candles -- that
  // changes what a *logical* bar index even means, so preserving by
  // logical index (as opposed to by actual time) still lets the visible
  // window jump. Time-based range is immune to that: it's the same wall-
  // clock window regardless of how many logical points now exist inside it.
  const preservedRange = chart.timeScale().getVisibleRange();

  priceLines.forEach((line) => candleSeries.removePriceLine(line));
  priceLines = [];
  indicatorLineSeries.forEach((series) => chart.removeSeries(series));
  indicatorLineSeries = [];

  if (indicatorsCheckbox.checked) {
    indicators.forEach((indicator) => {
      Object.entries(indicator.series).forEach(([subName, value]) => {
        const color = (indicator.colors || {})[subName] || "#898781";
        const title = indicator.name + " " + subName;

        if (indicator.kind === "level") {
          if (typeof value !== "number") return;
          const line = candleSeries.createPriceLine({
            price: value,
            color,
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title,
          });
          priceLines.push(line);
        } else if (indicator.kind === "series" && Array.isArray(value)) {
          const series = chart.addSeries(LightweightCharts.LineSeries, {
            color,
            lineWidth: 2,
            crosshairMarkerVisible: false,
            lastValueVisible: true,
            title,
          });
          series.setData(
            value
              .filter((p) => p.value != null)
              .map((p) => ({ time: toUnixSeconds(p.t), value: p.value }))
          );
          indicatorLineSeries.push(series);
        }
      });
    });
  }

  if (preservedRange) {
    chart.timeScale().setVisibleRange(preservedRange);
  }
}

indicatorsCheckbox.onchange = () => drawIndicatorLines(lastIndicators);

function setChartData(bars, vwap, indicators) {
  candleSeries.setData(bars.map(barToCandle));
  volumeSeries.setData(bars.map(barToVolume));

  const vwapPoints = [];
  bars.forEach((bar, i) => {
    const v = vwap[i];
    if (v != null) vwapPoints.push({ time: toUnixSeconds(bar.t), value: v });
  });
  vwapSeries.setData(vwapPoints);

  lastIndicators = indicators || [];
  drawIndicatorLines(lastIndicators);

  if (bars.length > 0) {
    const MIN_SPACING = 3;
    const MAX_SPACING = 10;
    const width = container.clientWidth || 1;
    const spacing = Math.min(MAX_SPACING, Math.max(MIN_SPACING, width / bars.length));
    const visibleCount = Math.min(bars.length, Math.max(1, Math.ceil(width / spacing)));
    chart.timeScale().setVisibleLogicalRange({ from: bars.length - visibleCount, to: bars.length - 1 });
    document.getElementById("last-price").textContent = bars[bars.length - 1].c.toFixed(2);
  }
}

async function loadChart() {
  if (!symbol) {
    statusEl.textContent = "Select a symbol from the dropdown.";
    return;
  }
  const option = TIMEFRAME_OPTIONS.find((o) => o.key === activeKey) || TIMEFRAME_OPTIONS[1];
  statusEl.textContent = "Loading " + symbol + "…";
  try {
    const timeframeParam = option.kind === "intraday" ? "1Min" : option.alpacaTimeframe;
    const res = await fetch("/api/symbols/" + encodeURIComponent(symbol) + "/bars?timeframe=" + timeframeParam);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    let bars = data.bars;
    let vwap = data.vwap;
    // "series"-kind indicators (e.g. an EMA) are minute-resolution -- on an
    // hourly/daily/weekly/monthly chart that's both semantically odd to
    // overlay and, left unaggregated, would trip the same
    // resolution-mismatch zoom bug aggregateBars exists to avoid. "level"
    // lines are flat values, unaffected either way, so only those show
    // outside the intraday view.
    let indicators = option.kind === "intraday"
      ? data.indicators
      : (data.indicators || []).filter((i) => i.kind === "level");
    if (option.kind === "intraday" && option.minutes > 1) {
      const agg = aggregateBars(bars, vwap, option.minutes, indicators);
      bars = agg.bars;
      vwap = agg.vwap;
      indicators = agg.indicators;
    }
    if (!bars.length) {
      statusEl.textContent = "No " + option.label + " data available for " + symbol + ".";
      candleSeries.setData([]);
      volumeSeries.setData([]);
      vwapSeries.setData([]);
      lastIndicators = [];
      drawIndicatorLines(lastIndicators);
      return;
    }
    statusEl.textContent = "";
    setChartData(bars, vwap, indicators);
  } catch (err) {
    statusEl.textContent = "Failed to load chart: " + err.message;
  }
}

loadChart();
</script>
</body>
</html>
