[project]
name = "trading-dashboard-backend"
version = "0.1.0"
description = "Local real-time stocks-in-play scanner + chart backend (Alpaca-powered)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alpaca-py>=0.33",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "pandas_ta>=0.3",
    "numpy>=2.0",
    "pandas_market_calendars>=4.4",
    "orjson>=3.10",
    "websockets>=13.1",
    "anthropic>=0.90",
    "dash>=2.18",
    "plotly>=5.24",
    "a2wsgi>=1.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
